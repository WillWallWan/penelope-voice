<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penelope">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <title>Penelope</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .header .logo { font-size: 28px; }
    .header .name { font-size: 16px; font-weight: 300; letter-spacing: 2px; margin-top: 4px; color: #d4a017; }
    .header .status { font-size: 13px; color: #555; margin-top: 6px; transition: color 0.3s; }
    .header .status.active { color: #d4a017; }

    /* Orb */
    .orb-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      flex-shrink: 0;
    }
    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
      background: radial-gradient(circle at 35% 35%, #f5d87a, #d4a017 40%, #8b6914 70%, #5a4510 100%);
      box-shadow:
        0 0 30px rgba(212, 160, 23, 0.3),
        inset 0 -4px 12px rgba(0,0,0,0.3),
        inset 0 4px 12px rgba(255,255,255,0.15);
      animation: orb-idle 4s ease-in-out infinite;
    }
    .orb:active { transform: scale(0.95); }
    .orb::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 30%;
      height: 25%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.35), transparent);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    @keyframes orb-idle {
      0%, 100% { box-shadow: 0 0 30px rgba(212, 160, 23, 0.3), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
      50% { box-shadow: 0 0 45px rgba(212, 160, 23, 0.4), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
    }

    .orb.connecting {
      animation: orb-pulse 1.2s ease-in-out infinite;
    }
    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(212, 160, 23, 0.3), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
      50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(212, 160, 23, 0.6), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
    }

    .orb.listening {
      animation: orb-listen 2s ease-in-out infinite;
    }
    @keyframes orb-listen {
      0%, 100% { box-shadow: 0 0 40px rgba(212, 160, 23, 0.4), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
      50% { box-shadow: 0 0 60px rgba(212, 160, 23, 0.7), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
    }

    .orb.speaking {
      animation: orb-speak 0.8s ease-in-out infinite;
    }
    @keyframes orb-speak {
      0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(255, 215, 0, 0.5), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
      50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(255, 215, 0, 0.8), inset 0 -4px 12px rgba(0,0,0,0.3), inset 0 4px 12px rgba(255,255,255,0.15); }
    }

    .orb.active {
      background: radial-gradient(circle at 35% 35%, #ffecb3, #ffd700 40%, #d4a017 70%, #8b6914 100%);
    }

    /* Transcript */
    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .transcript::-webkit-scrollbar { width: 4px; }
    .transcript::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { align-self: flex-end; background: #1a1a2e; border-bottom-right-radius: 4px; color: #ccc; }
    .msg.agent { align-self: flex-start; background: #1a1500; border-bottom-left-radius: 4px; color: #f0e6c8; }
    .msg .label { font-size: 11px; font-weight: 600; margin-bottom: 3px; opacity: 0.4; text-transform: uppercase; letter-spacing: 1px; }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 14px;
    }

    /* Mute button */
    .mute-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #222;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .mute-btn:hover { background: #333; }
    .mute-btn.visible { display: flex; }
    .mute-btn.muted { background: #e74c3c; color: #fff; }

    .footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #333;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✨</div>
    <div class="name">PENELOPE</div>
    <div class="status" id="status">Tap the orb to connect</div>
  </div>

  <div class="orb-container">
    <div class="orb" id="orb" onclick="toggleCall()"></div>
  </div>

  <div class="transcript" id="transcript">
    <div class="empty-state" id="emptyState">Start a call to begin</div>
  </div>

  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🎤</button>

  <div class="footer">Penelope Voice</div>

  <script type="module">
    let Conversation;
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@0.14.0/+esm');
      Conversation = mod.Conversation;
    } catch (e1) {
      try {
        const mod = await import('https://unpkg.com/@elevenlabs/client@0.14.0/dist/browser/index.js');
        Conversation = mod.Conversation;
      } catch (e2) {
        console.error('Failed to load ElevenLabs SDK:', e1, e2);
        document.getElementById('status').textContent = 'Failed to load SDK — try refreshing';
      }
    }

    if (!Conversation) {
      // Bail early
      window.toggleCall = () => alert('SDK failed to load. Please refresh.');
      window.toggleMute = () => {};
    } else {

    const AGENT_ID = 'agent_2401khm7anp3ejrt7xccsckqpnm8';
    let conversation = null;
    let isMuted = false;

    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const emptyState = document.getElementById('emptyState');
    const orb = document.getElementById('orb');
    const muteBtn = document.getElementById('muteBtn');

    function addMessage(text, role) {
      if (!text || !text.trim()) return;
      emptyState.style.display = 'none';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'agent' ? 'Penelope' : 'You';
      const content = document.createElement('div');
      content.textContent = text;
      div.appendChild(label);
      div.appendChild(content);
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return div;
    }

    let currentAgentMsg = null;

    window.toggleCall = async function() {
      if (conversation) {
        await conversation.endSession();
        conversation = null;
        orb.className = 'orb';
        muteBtn.classList.remove('visible');
        statusEl.textContent = 'Call ended';
        statusEl.classList.remove('active');
        return;
      }

      try {
        orb.className = 'orb connecting';
        statusEl.textContent = 'Connecting...';
        statusEl.classList.add('active');

        conversation = await Conversation.startSession({
          agentId: AGENT_ID,
          onConnect: () => {
            orb.className = 'orb active listening';
            muteBtn.classList.add('visible');
            statusEl.textContent = 'Connected';
          },
          onDisconnect: () => {
            orb.className = 'orb';
            muteBtn.classList.remove('visible');
            statusEl.textContent = 'Disconnected';
            statusEl.classList.remove('active');
            conversation = null;
          },
          onModeChange: (mode) => {
            if (mode.mode === 'listening') {
              orb.className = 'orb active listening';
              statusEl.textContent = 'Listening...';
              currentAgentMsg = null;
            } else if (mode.mode === 'speaking') {
              orb.className = 'orb active speaking';
              statusEl.textContent = 'Speaking...';
            }
          },
          onMessage: (message) => {
            if (message.source === 'user') {
              addMessage(message.message, 'user');
            } else if (message.source === 'ai') {
              if (!currentAgentMsg) {
                currentAgentMsg = addMessage(message.message, 'agent');
              } else {
                currentAgentMsg.querySelector('div:last-child').textContent = message.message;
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
              }
            }
          },
          onError: (error) => {
            statusEl.textContent = 'Error — tap to retry';
            orb.className = 'orb';
            console.error('ElevenLabs error:', error);
          },
        });
      } catch (err) {
        orb.className = 'orb';
        statusEl.textContent = 'Failed — tap to retry';
        statusEl.classList.remove('active');
        console.error('Failed to start:', err);
      }
    };

    window.toggleMute = function() {
      if (!conversation) return;
      isMuted = !isMuted;
      conversation.setVolume({ volume: isMuted ? 0 : 1 });
      muteBtn.classList.toggle('muted', isMuted);
      muteBtn.textContent = isMuted ? '🔇' : '🎤';
    };

    } // end if Conversation loaded
  </script>
</body>
</html>
