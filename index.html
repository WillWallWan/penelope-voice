<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penelope">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <title>Penelope</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* Try to force the widget to fill the screen */
    elevenlabs-convai {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <elevenlabs-convai 
    agent-id="agent_2401khm7anp3ejrt7xccsckqpnm8"
    variant="full"
    default-expanded="true"
    always-expanded="true"
    expandable="always"
  ></elevenlabs-convai>
  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>
  <script>
    // Try to auto-expand widget after load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const widget = document.querySelector('elevenlabs-convai');
        if (widget && widget.shadowRoot) {
          // Look for expand button inside shadow DOM and click it
          const expandBtn = widget.shadowRoot.querySelector('[data-testid="expand-button"], button[aria-label*="expand"], button[aria-label*="Open"]');
          if (expandBtn) expandBtn.click();
        }
      }, 2000);
    });
  </script>
</body>
</html>
